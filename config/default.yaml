log_level: INFO
max_content_length: 100000

scanners:
  invisible_text:
    enabled: true
  html_sanitizer:
    enabled: true
  xml_safe_parser:
    enabled: true
  prompt_guard:
    enabled: true
    threshold_block: 0.9
    threshold_flag: 0.7
  pii_detector:
    enabled: true
    threshold_block: 0.9
    threshold_flag: 0.7
  url_scanner:
    enabled: true
  llm_judge:
    enabled: true
    threshold_block: 0.8
    threshold_flag: 0.5

tier3_sources:
  - email
  - web
  - unknown
