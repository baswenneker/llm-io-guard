[project]
name = "llm_io_guard"
version = "0.1.0"
description = "Extensible LLM input/output content filter"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "Bas Wenneker", email = "bas@headingfwd.com"},
]
keywords = ["llm", "content-safety", "prompt-injection", "pii-detection", "input-filter", "output-filter"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "structlog>=24.0.0",
    "pydantic>=2.5,<3",
    "pyyaml>=6.0,<7",
    "html-sanitizer>=2.0",
    "defusedxml>=0.7.0",
    "confusable-homoglyphs>=3.0.0",
]

[project.urls]
Homepage = "https://github.com/HeadingFWD/llm_io_guard"
Repository = "https://github.com/HeadingFWD/llm_io_guard"
Issues = "https://github.com/HeadingFWD/llm_io_guard/issues"
Changelog = "https://github.com/HeadingFWD/llm_io_guard/blob/main/CHANGELOG.md"

[project.optional-dependencies]
ml = [
    "torch>=2.0.0",
    "transformers>=4.35.0",
]
pii = [
    "presidio-analyzer>=2.2,<3",
    "presidio-anonymizer>=2.2,<3",
]
llm-judge = [
    "anthropic>=0.40.0",
]
url = [
    "pysafebrowsing>=0.1.1",
]
all = [
    "llm_io_guard[ml,pii,llm-judge,url]",
]
dev = [
    "llm_io_guard[all]",
    "pytest>=8.0.0",
    "pytest-xdist>=3.5.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.3.0",
    "mypy>=1.8.0",
    "pyright>=1.1.0",
    "bandit[toml]>=1.7.0",
    "interrogate>=1.5.0",
    "types-PyYAML>=6.0",
    "build>=1.0.0",
    "twine>=5.0.0",
]
notebooks = [
    "jupyter>=1.0.0",
    "jupyterlab>=4.0.0",
    "ipykernel>=6.0.0",
    "ipywidgets>=8.0.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "plotly>=5.14.0",
    "nbstripout>=0.6.0",
]
agents = [
    "langchain>=1.0.0",
    "langchain-core>=1.0.0",
    "langchain-openai>=1.0.0",
    "langgraph>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_io_guard"]


[tool.pytest.ini_options]
# addopts = "-p no:warnings -rPA --color=yes -s " # Uncomment the next line to run tests in parallel with auto-discovery
addopts = "-p no:warnings -rPA --color=yes -s -n auto"
env = ["ENVIRONMENT=test"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["src", "tests"]
markers = [
    "serial: marks tests as serial, often when accessing dbs or files that are not thread-safe (deselect with '-m \"not serial\"')",
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "adversarial: adversarial test cases",
    "benchmark: marks benchmark tests",
]

[tool.pyright]
pythonVersion = "3.12"
include = ["./src/**/*.py"]
exclude = ["./tests"]
typeCheckingMode = "basic"
pythonPlatform = "Linux"
reportMissingModuleSource = "none"
reportUnnecessaryTypeIgnoreComment = "error"

[tool.bandit]
targets = ["src"]

[tool.ruff]
fix = true
lint.select = ["E", "F", "I", "N", "W", "UP", "S", "B", "A", "C4", "SIM", "TCH"]
lint.ignore = ["E501"]
line-length = 100
target-version = "py312"

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]
"tests/helpers.py" = ["S101"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.params.Depends",
    "fastapi.Query",
    "fastapi.params.Query",
]

[tool.mypy]
strict = false
ignore_missing_imports = true
disallow_untyped_defs = false
disallow_untyped_calls = false
disallow_any_generics = false
disallow_subclassing_any = false
no_implicit_optional = false
warn_return_any = false
warn_unused_ignores = true
check_untyped_defs = false

[tool.interrogate]
ignore-init-module = true
ignore-module = true
fail-under = 90
verbose = 3