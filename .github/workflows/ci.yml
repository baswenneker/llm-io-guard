name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv sync --all-extras
      - name: Lint
        run: |
          uv run ruff check src/ tests/
          uv run ruff format --check src/ tests/
      - name: Type check
        run: |
          uv run mypy src/
          uv run pyright src/
      - name: Run tests
        run: uv run pytest -m "not slow and not benchmark" --cov=llm_io_guard --cov-report=xml
      - name: Run benchmark tests
        run: uv run pytest -m benchmark
